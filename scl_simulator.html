<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador SCL Avanzado - Automatización</title>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- CodeMirror CSS (Editor de Código) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/darcula.min.css">

    <style>
        /* Variables y Tema Industrial Oscuro */
        :root {
            --sena-green: #39A900;
            --sena-green-hover: #2d8500;
            --bg-dark: #121212;
            --panel-dark: #1e1e1e;
            --text-light: #e0e0e0;
            --text-dark: #333333;
            --bg-white: #ffffff;
            --border-color: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            background-color: var(--panel-dark);
            border-bottom: 3px solid var(--sena-green);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-logo { height: 40px; }
        .header-title { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; color: var(--text-light); }

        /* MAIN LAYOUT (3 COLUMNAS) */
        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            flex: 1;
            gap: 15px;
            padding: 15px;
            overflow: hidden;
        }

        .column {
            background-color: var(--panel-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .col-header {
            background-color: #252525;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            color: var(--sena-green);
            text-transform: uppercase;
        }

        /* COLUMNA 1: TEMARIO Y TEORÍA */
        .menu-lecciones {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 5px;
            background-color: #1a1a1a;
            max-height: 250px;
            overflow-y: auto;
        }
        .btn-leccion {
            background-color: #333;
            color: white;
            border: 1px solid #444;
            padding: 8px 10px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .btn-leccion:hover, .btn-leccion.active {
            background-color: var(--sena-green);
            border-color: var(--sena-green);
        }

        .teoria-container {
            flex: 1;
            background-color: var(--bg-white);
            color: var(--text-dark);
            padding: 20px;
            overflow-y: auto;
            border-top: 2px solid var(--sena-green);
        }
        .teoria-container h3 { margin-bottom: 15px; color: var(--sena-green); border-bottom: 1px solid #ddd; padding-bottom: 5px;}
        .teoria-container p { margin-bottom: 12px; line-height: 1.6; font-size: 0.95rem; }
        .teoria-container ul { margin-left: 20px; margin-bottom: 12px; font-size: 0.95rem;}
        .teoria-container code { background: #f4f4f4; padding: 2px 5px; border-radius: 4px; font-family: 'Fira Code', monospace; color: #d32f2f; font-weight: bold;}
        .teoria-container pre { background: #2b2b2b; color: #a9b7c6; padding: 10px; border-radius: 5px; margin-bottom: 15px; overflow-x: auto; font-family: 'Fira Code', monospace; font-size: 0.85rem;}

        /* COLUMNA 2: EDITOR Y CONSOLA */
        .toolbar {
            display: flex;
            padding: 10px;
            gap: 10px;
            background-color: #252525;
            border-bottom: 1px solid var(--border-color);
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-compile { background-color: #1976d2; }
        .btn-compile:hover { background-color: #115293; }
        .btn-run { background-color: var(--sena-green); }
        .btn-run:hover { background-color: var(--sena-green-hover); }
        .btn-stop { background-color: #d32f2f; }
        .btn-stop:hover { background-color: #b71c1c; }

        .editor-container { flex: 1; display: flex; flex-direction: column; }
        .CodeMirror { flex: 1; font-family: 'Fira Code', monospace; font-size: 15px; }

        .consola {
            height: 150px;
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Fira Code', monospace;
            padding: 10px;
            overflow-y: auto;
            border-top: 2px solid var(--border-color);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        /* COLUMNA 3: SIMULACIÓN HMI */
        .hmi-container {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #222;
            position: relative;
        }

        /* Indicadores LED */
        .led-panel {
            display: flex;
            width: 100%;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #111;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
        }
        .led-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            color: #aaa;
            font-weight: bold;
        }
        .led {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #333;
            border: 2px solid #555;
            margin-bottom: 5px;
            transition: 0.1s;
        }
        .led.active-green { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .led.active-red { background-color: #ff0000; box-shadow: 0 0 10px #ff0000; animation: blink 1s infinite; }

        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.4;} 100% {opacity: 1;} }

        /* Tanque y Motor */
        .planta-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .motor-box {
            width: 70px;
            height: 50px;
            background: #444;
            border: 3px solid #777;
            border-radius: 5px 5px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            position: relative;
        }
        .aspas { width: 40px; height: 8px; background-color: #aaa; border-radius: 4px; }
        .spin { animation: spinAnim 0.3s linear infinite; background-color: var(--sena-green); }
        @keyframes spinAnim { 100% { transform: rotate(360deg); } }

        .tanque {
            width: 140px;
            height: 180px;
            border: 4px solid #888;
            border-top: none;
            border-radius: 0 0 15px 15px;
            position: relative;
            background-color: rgba(255,255,255,0.05);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .liquido {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%; 
            background: linear-gradient(to right, #0288d1, #29b6f6);
            transition: height 0.1s linear;
        }
        .escala {
            position: absolute;
            left: 5px;
            bottom: 5px;
            color: rgba(255,255,255,0.5);
            font-size: 0.7rem;
            font-family: monospace;
            z-index: 5;
        }

        .sensor-temp {
            background: #000;
            color: #ff5252;
            font-family: 'Fira Code', monospace;
            border: 2px solid #555;
            padding: 8px 15px;
            font-size: 1.4rem;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255,0,0,0.2);
        }

        .hmi-buttons { display: flex; gap: 20px; }
        .btn-hmi {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 4px solid #222;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.6);
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
            text-shadow: 1px 1px 2px black;
        }
        .btn-hmi:active { transform: scale(0.92); box-shadow: inset 0 3px 5px rgba(0,0,0,0.8); }
        .hmi-start { background: linear-gradient(145deg, #4caf50, #2e7d32); }
        .hmi-stop { background: linear-gradient(145deg, #f44336, #c62828); }

        /* Watch Table */
        .watch-table-container {
            height: 250px;
            background-color: var(--bg-white);
            color: var(--text-dark);
            overflow-y: auto;
            border-top: 2px solid var(--sena-green);
        }
        table { width: 100%; border-collapse: collapse; font-family: 'Fira Code', monospace; font-size: 0.8rem; }
        th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
        th { background-color: #f2f2f2; position: sticky; top: 0; color: #333;}
        .val-true { color: #2e7d32; font-weight: bold; }
        .val-false { color: #c62828; font-weight: bold; }
        .val-num { color: #0277bd; font-weight: bold; }

        /* FOOTER */
        footer {
            background-color: var(--panel-dark);
            border-top: 1px solid var(--border-color);
            padding: 12px 20px;
            text-align: right;
            color: var(--sena-green);
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Sena_Colombia_logo.svg" alt="SENA" class="header-logo">
        <div class="header-title">SIMULADOR SCL - IEC 61131-3</div>
        <div style="width: 40px;"></div> 
    </header>

    <!-- Contenido Principal -->
    <div class="main-grid">
        
        <!-- Columna 1: Temario -->
        <div class="column">
            <div class="col-header">MÓDULOS DE APRENDIZAJE</div>
            <div class="menu-lecciones" id="menu-lecciones"></div>
            <div class="teoria-container" id="teoria-content"></div>
        </div>

        <!-- Columna 2: Editor SCL -->
        <div class="column">
            <div class="col-header">EDITOR DE TEXTO ESTRUCTURADO (OB1)</div>
            <div class="toolbar">
                <button class="btn btn-compile" onclick="compilar()">⚙️ Compilar Código</button>
                <button class="btn btn-run" onclick="iniciarPLC()">▶️ RUN</button>
                <button class="btn btn-stop" onclick="detenerPLC()">⏹️ STOP</button>
            </div>
            <div class="editor-container">
                <textarea id="code-editor"></textarea>
            </div>
            <div class="consola" id="consola">
                > Sistema inicializado. Selecciona un módulo a la izquierda.<br>
            </div>
        </div>

        <!-- Columna 3: HMI -->
        <div class="column">
            <div class="col-header">PLANTA VIRTUAL Y VARIABLES</div>
            <div class="hmi-container">
                
                <!-- Panel de Indicadores Discretos -->
                <div class="led-panel">
                    <div class="led-indicator">
                        <div class="led" id="led-valvula"></div>
                        VÁLVULA
                    </div>
                    <div class="led-indicator">
                        <div class="led" id="led-alarma"></div>
                        ALARMA
                    </div>
                </div>

                <!-- Planta -->
                <div class="planta-wrapper">
                    <div class="motor-box" id="motor-visual">
                        <div class="aspas" id="aspas-visual"></div>
                    </div>
                    <div class="tanque">
                        <div class="liquido" id="tanque-liquido"></div>
                        <div class="escala">0% -- 100%</div>
                    </div>
                </div>

                <div class="sensor-temp" id="temp-display">00.0 °C</div>

                <div class="hmi-buttons">
                    <!-- Eventos táctiles y de ratón para emular un pulsador real -->
                    <button class="btn-hmi hmi-start" 
                        onmousedown="presionarBoton('Start_Button', true)" 
                        onmouseup="presionarBoton('Start_Button', false)" 
                        onmouseleave="presionarBoton('Start_Button', false)"
                        ontouchstart="presionarBoton('Start_Button', true)"
                        ontouchend="presionarBoton('Start_Button', false)">START</button>
                    
                    <button class="btn-hmi hmi-stop" 
                        onmousedown="presionarBoton('Stop_Button', true)" 
                        onmouseup="presionarBoton('Stop_Button', false)" 
                        onmouseleave="presionarBoton('Stop_Button', false)"
                        ontouchstart="presionarBoton('Stop_Button', true)"
                        ontouchend="presionarBoton('Stop_Button', false)">STOP</button>
                </div>
            </div>

            <!-- Tabla de Variables -->
            <div class="watch-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Variable (Tag)</th>
                            <th>Tipo</th>
                            <th>Valor</th>
                        </tr>
                    </thead>
                    <tbody id="watch-table-body"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Pie de página -->
    <footer>
        Realizado por: ING. BRAYAN CAMILO NOREÑA AGUDELO
    </footer>

    <!-- Scripts CodeMirror -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/pascal/pascal.min.js"></script>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DEL EDITOR
        // ==========================================
        const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            lineNumbers: true,
            mode: "pascal", // Usamos pascal por similitud sintáctica
            theme: "darcula",
            indentUnit: 4,
            matchBrackets: true
        });

        // ==========================================
        // 2. ESTADO GLOBAL DEL PLC (Memoria)
        // ==========================================
        let PLC = {
            Start_Button: false, 
            Stop_Button: false,  
            Motor_On: false,     
            Valvula_Llenado: false, 
            Alarma_Nivel: false,
            Nivel_Tanque: 0.0,   
            Temperatura: 25.0    
        };

        const DataTypes = {
            Start_Button: 'BOOL', Stop_Button: 'BOOL', Motor_On: 'BOOL', 
            Valvula_Llenado: 'BOOL', Alarma_Nivel: 'BOOL',
            Nivel_Tanque: 'REAL', Temperatura: 'REAL'
        };

        let scanInterval = null;
        let compiledJS = "";

        // ==========================================
        // 3. MÓDULOS DE APRENDIZAJE (TEORÍA NORMA IEC 61131-3)
        // ==========================================
        const lecciones = [
            {
                titulo: "1. Fundamentos y Asignación",
                teoria: `<h3>Sintaxis SCL (IEC 61131-3)</h3>
                         <p>El Texto Estructurado (SCL) es un lenguaje de alto nivel basado en Pascal. Las características clave son:</p>
                         <ul>
                            <li>La asignación de valores usa <code>:=</code> (ej. <code>Variable := 10;</code>).</li>
                            <li>Toda instrucción debe terminar en punto y coma <code>;</code>.</li>
                            <li>El símbolo <code>=</code> se usa <b>sólo</b> para comparar.</li>
                            <li>Los comentarios se escriben con <code>//</code> o <code>(* ... *)</code>.</li>
                         </ul>
                         <p><b>Práctica:</b> Conecta directamente el pulsador de START al Motor.</p>`,
                codigo: `// Asignación directa (Bobina directa en Ladder)\nMotor_On := Start_Button;\n\n// El tanque se llena solo si el motor está encendido\nValvula_Llenado := Motor_On;`
            },
            {
                titulo: "2. Lógica Booleana y IF",
                teoria: `<h3>Condicionales IF-THEN</h3>
                         <p>Permiten ejecutar código basado en condiciones lógicas (AND, OR, NOT).</p>
                         <pre>IF condicion THEN\n    sentencias;\nELSIF otra_condicion THEN\n    sentencias;\nELSE\n    sentencias;\nEND_IF;</pre>
                         <p><b>Práctica:</b> Realiza un "Enclavamiento" (Set/Reset) para el Motor. Nota que los pulsadores HMI son de contacto momentáneo, por eso necesitas memorizar el estado.</p>`,
                codigo: `// Lógica de SET (Arranque memorizado)\nIF Start_Button = TRUE THEN\n    Motor_On := TRUE;\nEND_IF;\n\n// Lógica de RESET (Parada)\nIF Stop_Button = TRUE THEN\n    Motor_On := FALSE;\nEND_IF;`
            },
            {
                titulo: "3. Matemáticas Analógicas",
                teoria: `<h3>Cálculos con Reales (REAL)</h3>
                         <p>En SCL podemos utilizar operadores aritméticos (<code>+</code>, <code>-</code>, <code>*</code>, <code>/</code>).</p>
                         <p>En esta simulación, simularemos un transmisor de nivel. Si la válvula está abierta, sumamos líquido por cada ciclo de scan.</p>
                         <p><i>Nota: En un PLC real, esto se hace en un OB cíclico (OB30) multiplicando por el Ts.</i></p>`,
                codigo: `// Enclavamiento de válvula\nIF Start_Button THEN Valvula_Llenado := TRUE; END_IF;\nIF Stop_Button THEN Valvula_Llenado := FALSE; END_IF;\n\n// Integración matemática de nivel\nIF Valvula_Llenado THEN\n    Nivel_Tanque := Nivel_Tanque + 0.5;\nEND_IF;\n\n// Limitar el tanque y encender alarma\nIF Nivel_Tanque >= 100.0 THEN\n    Nivel_Tanque := 100.0;\n    Valvula_Llenado := FALSE;\n    Alarma_Nivel := TRUE;\nELSE\n    Alarma_Nivel := FALSE;\nEND_IF;`
            },
            {
                titulo: "4. Control de Mezcla (Proyecto)",
                teoria: `<h3>Máquina de Estados (Caso de Uso)</h3>
                         <p>Integraremos todo para hacer un proceso de BATCH (Mezclado):</p>
                         <ul>
                            <li>Al presionar START, la válvula llena el tanque.</li>
                            <li>Cuando el nivel llegue a 80%,
